<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>loading ...</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            background: #000;
        }
        iframe {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
        }
        .fallback {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a2e;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 20%;
            z-index: 9999;
        }
        .fallback a {
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="fallback" id="fallback">
        <h2>⚠️ Site failed to load</h2>
        <p>Your network might be blocking this content.</p>
        <p>Try opening this link directly:<br>
        <a href="https://journal.kitchen.photo.sysdsolutions.com/" target="_blank">
            journal.kitchen.photo.sysdsolutions.com/
        </a></p>
    </div>

    <iframe id="siteFrame" src="https://journal.kitchen.photo.sysdsolutions.com/"></iframe>

    <script>
        (function() {
            const frame = document.getElementById('siteFrame');
            const fallback = document.getElementById('fallback');

            function openInBlank() {
                try {
                    const blankWin = window.open('about:blank', '_blank');
                    if (!blankWin) {
                        showFallback();
                        return;
                    }
                    blankWin.document.write(`
                        <html>
                        <head><title>loading ...</title></head>
                        <body style="margin:0;overflow:hidden;background:#0a0e17;">
                            <iframe src="https://journal.kitchen.photo.sysdsolutions.com/"
                                    style="width:100vw;height:100vh;border:none;"></iframe>
                            <p style="position:fixed;bottom:10px;right:10px;color:#667;font-family:sans-serif;font-size:12px;">
                                Close this tab when done.
                            </p>
                        </body>
                        </html>
                    `);
                    blankWin.document.close();
                } catch (e) {
                    showFallback();
                }
            }

            function showFallback() {
                frame.style.display = 'none';
                fallback.style.display = 'block';
            }

            frame.onload = function() {
                console.log('Site loaded in iframe.');
            };

            frame.onerror = function() {
                openInBlank();
            };

            setTimeout(function() {
                try {
                    const loc = frame.contentWindow.location.href;
                    if (loc === 'about:blank' || loc === '') {
                        openInBlank();
                    }
                } catch (e) {
                    openInBlank();
                }
            }, 3000);

            document.addEventListener('click', function() {
                try {
                    if (frame.contentWindow.location.href.indexOf('sysdsolutions.com') === -1) {
                        openInBlank();
                    }
                } catch (e) {
                    openInBlank();
                }
            }, { once: false });

        })();
    </script>
</body>
</html>
