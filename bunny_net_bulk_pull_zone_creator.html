<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .sub-header {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #000000;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #ffffff;
            color: #000000;
            outline: none;
        }

        input:focus {
            background-color: #f0f0f0;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            padding: 12px 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            width: 100%;
            transition: background-color 0.1s ease;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: #000000;
            width: auto;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background-color: #000000;
            color: #ffffff;
        }

        #status {
            margin-top: 20px;
            padding: 12px;
            border: 1px dashed #000000;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        .results-section {
            margin-top: 40px;
            border-top: 2px solid #000000;
            padding-top: 20px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-title {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .card {
            border: 1px solid #000000;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #ffffff;
        }

        .card-meta {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            color: #666666;
            margin-bottom: 5px;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .link-text {
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            border: 1px dashed #cccccc;
            color: #666666;
            font-size: 13px;
        }

        .footer-notes {
            margin-top: 40px;
            border-top: 1px solid #000000;
            padding-top: 20px;
            font-size: 12px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        .footer-notes a {
            color: #000000;
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Link Generator</h1>
        <div class="sub-header">(Made by FlintAKN on discord)</div>

        <div class="form-group">
            <label for="apiKey">ACCESS KEY:</label>
            <input type="password" id="apiKey" value="">
        </div>

        <div class="form-group">
            <label for="originUrl">ORIGIN URL:</label>
            <input type="text" id="originUrl" placeholder="https://example.com">
        </div>

        <div class="form-group">
            <label for="zoneName">ZONE NAME:</label>
            <div class="row">
                <input type="text" id="zoneName">
                <button onclick="randomizeName()" class="btn btn-secondary">Randomize</button>
            </div>
        </div>

        <div class="form-group">
            <label for="quantity">QUANTITY:</label>
            <input type="number" id="quantity" value="1" min="1" max="100">
        </div>

        <div class="form-group" style="margin-top: 30px;">
            <button id="createBtn" onclick="createMultipleZones()" class="btn">CREATIONISM</button>
        </div>

        <div id="status" class="hidden"></div>

        <div class="results-section">
            <div class="results-header">
                <span class="results-title">Output Linkage</span>
                <button onclick="copyAll()" id="copyAllBtn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 10px;">Copy All Links</button>
            </div>

            <div id="resultsList">
                <div id="emptyState" class="empty-state">
                    Define details above and click execute to populate new zones.
                </div>
            </div>
        </div>

        <div class="footer-notes">
            <div>- Only and the fastest link gen that bypasses Bunny.net fruad detection, if detected, please DM flintakn.</div>
            <div>- join the discord: <a href="https://discord.gg/zBCucsUbSZ" target="_blank" rel="noopener noreferrer">https://discord.gg/zBCucsUbSZ</a></div>
        </div>
    </div>

    <script>
        const subjects = [
            'math', 'science', 'biology', 'chemistry', 'ap-class-studies',
            'physics', 'history', 'algebra', 'calculus', 'geometry',
            'literature', 'psychology', 'economics', 'statistics'
        ];

        function generateSingleName() {
            const subject = subjects[Math.floor(Math.random() * subjects.length)];
            const num = Math.floor(Math.random() * 1000000000).toString().padStart(9, '0');
            return subject + '-' + num;
        }

        function randomizeName() {
            document.getElementById('zoneName').value = generateSingleName();
        }

        window.onload = randomizeName;

        function setStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.classList.remove('hidden');
            
            if (type === 'danger') {
                el.style.borderStyle = 'solid';
            } else if (type === 'success') {
                el.style.borderStyle = 'double';
            } else {
                el.style.borderStyle = 'dashed';
            }
        }

        async function createMultipleZones() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const origin = document.getElementById('originUrl').value.trim();
            const baseNameInput = document.getElementById('zoneName').value.trim();
            const quantityInput = document.getElementById('quantity');
            const btn = document.getElementById('createBtn');
            const list = document.getElementById('resultsList');
            const emptyState = document.getElementById('emptyState');

            let quantity = parseInt(quantityInput.value) || 1;
            quantity = Math.min(Math.max(quantity, 1), 100);

            if (!apiKey || !origin || !baseNameInput) {
                setStatus('Please fill in all fields.', 'danger');
                return;
            }

            btn.disabled = true;
            
            // Clear previous cards, keep emptyState target clean
            const existingCards = list.querySelectorAll('.card');
            existingCards.forEach(card => card.remove());
            emptyState.classList.remove('hidden');
            
            setStatus(`Processing ${quantity} pull zones...`, 'info');

            const tasks = [];

            for (let i = 0; i < quantity; i++) {
                const currentName = i === 0 ? baseNameInput : generateSingleName();
                
                const task = fetch('https://api.bunny.net/pullzone', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'AccessKey': apiKey
                    },
                    body: JSON.stringify({
                        Name: currentName,
                        OriginUrl: origin,
                        Type: 0,
                        EnableGeoZoneUS: true,
                        EnableGeoZoneEU: true,
                        EnableGeoZoneASIA: true,
                        EnableGeoZoneSA: true,
                        EnableGeoZoneAF: true
                    })
                }).then(async res => {
                    if (!res.ok) return null;
                    const data = await res.json();
                    return { name: currentName, data };
                }).catch(() => null);

                tasks.push(task);
            }

            const results = await Promise.all(tasks);
            
            let successCount = 0;
            results.forEach(res => {
                if (res) {
                    const host = (res.data.Hostnames && res.data.Hostnames.length > 0) 
                        ? res.data.Hostnames[0].Value 
                        : (res.name + '.b-cdn.net');
                    
                    const link = 'https://' + host + '/';
                    const item = document.createElement('div');
                    item.className = 'card';
                    item.innerHTML = `
                        <div class="card-meta">SUCCESSFUL CREATION</div>
                        <div class="card-title">${res.name.toUpperCase()}</div>
                        <div class="link-text">${link}</div>
                    `;
                    list.appendChild(item);
                    successCount++;
                }
            });

            btn.disabled = false;

            if (successCount > 0) {
                emptyState.classList.add('hidden');
                setStatus(`Done! Successfully created ${successCount} zones.`, 'success');
            } else {
                setStatus('Failed to create zones. Verify API key and unique names.', 'danger');
            }
        }

        function copyAll() {
            const links = Array.from(document.querySelectorAll('.link-text')).map(el => el.textContent).join('\n');
            const btn = document.getElementById('copyAllBtn');
            if(!links) return;
            
            const textArea = document.createElement("textarea");
            textArea.value = links;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    const originalText = btn.textContent;
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = originalText, 1500);
                }
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
