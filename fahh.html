<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyx Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a10;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 30px;
            background: rgba(12, 12, 20, 0.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid #1c1c2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .logo small {
            font-size: 13px;
            -webkit-text-fill-color: #666;
            font-weight: 400;
            margin-left: 6px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls input,
        .controls select {
            padding: 7px 14px;
            border-radius: 30px;
            border: 1px solid #262633;
            background: #14141e;
            color: #ddd;
            outline: none;
            font-size: 13px;
            transition: 0.2s;
        }
        .controls input:focus,
        .controls select:focus {
            border-color: #a855f7;
        }
        .controls input {
            width: 180px;
        }
        .controls select {
            background: #14141e;
            cursor: pointer;
        }

        .controls button {
            padding: 7px 18px;
            border: none;
            border-radius: 30px;
            background: #1e1e2a;
            color: #ccc;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            font-size: 13px;
        }
        .controls button:hover {
            background: #2e2e3e;
            color: #fff;
        }
        .controls .fs-btn {
            background: #7c3aed;
            color: #fff;
        }
        .controls .fs-btn:hover {
            background: #6d28d9;
        }

        .catalog {
            padding: 25px 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 22px;
            flex: 1;
        }

        .game-card {
            background: #111118;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #1a1a26;
            cursor: pointer;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #7c3aed;
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.12);
        }

        .game-card .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #16161f;
            overflow: hidden;
            position: relative;
        }
        .game-card .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .game-card .thumb .badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 600;
            color: #aaa;
            border: 1px solid #2a2a3a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .game-card .info {
            padding: 10px 12px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .game-card .info h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-card .info .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .game-card .info .tags span {
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 20px;
            background: #1e1e2a;
            color: #888;
            border: 1px solid #262633;
        }
        .game-card .info .launch-btn {
            margin-top: 8px;
            padding: 4px 14px;
            border: none;
            border-radius: 20px;
            background: #2a2a3a;
            color: #ccc;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            align-self: flex-start;
        }
        .game-card .info .launch-btn:hover {
            background: #7c3aed;
            color: #fff;
        }

        .embed-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: none;
            flex-direction: column;
        }
        .embed-overlay.active {
            display: flex;
        }

        .embed-overlay .top-bar {
            padding: 10px 24px;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
            z-index: 2;
        }
        .embed-overlay .top-bar .game-title {
            font-weight: 600;
            font-size: 14px;
            color: #eee;
        }
        .embed-overlay .top-bar .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: #fff;
            padding: 5px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .embed-overlay .top-bar .close-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff4444;
        }

        .embed-overlay .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            color: #555;
            z-index: 1;
            pointer-events: none;
        }
        .embed-overlay .loader .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #1a1a2a;
            border-top: 3px solid #7c3aed;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        .embed-overlay .loader .label {
            font-size: 14px;
            letter-spacing: 1px;
        }

        .embed-overlay iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #0a0a10;
            z-index: 1;
            position: relative;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 700px) {
            header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: stretch;
            }
            .controls {
                flex-wrap: wrap;
            }
            .controls input {
                width: 100%;
            }
            .controls select {
                flex: 1;
            }
            .catalog {
                padding: 14px;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 14px;
            }
            .embed-overlay .top-bar {
                padding: 8px 14px;
                flex-wrap: wrap;
                gap: 6px;
            }
        }
    </style>

        // ============================================================
        // DOM REFS
        // ============================================================

        const catalog = document.getElementById('catalog');
        const searchInput = document.getElementById('searchInput');
        const tagFilter = document.getElementById('tagFilter');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const embedOverlay = document.getElementById('embedOverlay');
        const embedFrame = document.getElementById('embedFrame');
        const embedTitle = document.getElementById('embedTitle');
        const closeEmbed = document.getElementById('closeEmbed');
        const loader = document.getElementById('loader');
        const loaderLabel = document.getElementById('loaderLabel');

        // ============================================================
        // LOCAL FILES MAP
        // ============================================================

        const LOCAL_FILES = {
            minecraft: "novix.html",
            vicecity: "gtavc.html",
        };

        // ============================================================
        // GET LOCAL FALLBACK (blob URL)
        // ============================================================

        function getLocalFallback(game) {
            if (LOCAL_FILES[game.key]) {
                return LOCAL_FILES[game.key];
            }

            const html = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>${game.name}</title>
          <style>
            body{margin:0;background:#0a0a10;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#eee;flex-direction:column;gap:20px;padding:20px}
            img{max-width:80%;max-height:55vh;border-radius:12px;border:1px solid #2a2a3a;object-fit:contain}
            h2{font-weight:300;letter-spacing:1px;margin:0}
            span{color:#7c3aed;font-weight:600}
            p{color:#666;font-size:13px;margin:0}
            .tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
            .tag{background:#1a1a2a;padding:4px 12px;border-radius:20px;font-size:11px;color:#888;border:1px solid #262633}
            .back{position:fixed;top:20px;left:20px;color:#555;font-size:12px;background:#111;padding:6px 16px;border-radius:20px;border:1px solid #222;cursor:pointer;transition:0.2s;z-index:999}
            .back:hover{color:#aaa;border-color:#444}
          </style>
        </head>
        <body>
          <div class="back" onclick="window.parent.document.getElementById('closeEmbed').click()">← back</div>
          <img src="${game.img}" alt="${game.name}" onerror="this.style.display='none'">
          <h2>▶ <span>${game.name}</span></h2>
          <div class="tags">${game.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <p>local fallback — ready to play</p>
        </body>
        </html>
      `;

            const blob = new Blob([html], { type: 'text/html' });
            return URL.createObjectURL(blob);
        }

        // ============================================================
        // TAG EXTRACTION
        // ============================================================

        function getAllTags() {
            const set = new Set();
            GAMES.forEach(g => g.tags.forEach(t => set.add(t)));
            return Array.from(set).sort();
        }

        function populateTagFilter() {
            getAllTags().forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                tagFilter.appendChild(opt);
            });
        }
        populateTagFilter();

        // ============================================================
        // RENDER
        // ============================================================

        function renderGames() {
            const search = searchInput.value.toLowerCase().trim();
            const tag = tagFilter.value;

            const filtered = GAMES.filter(g => {
                const matchName = g.name.toLowerCase().includes(search);
                const matchTag = tag === 'all' || g.tags.includes(tag);
                return matchName && matchTag;
            });

            catalog.innerHTML = '';

            if (filtered.length === 0) {
                catalog.innerHTML =
                    `<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#555;font-size:16px;">no games found.</div>`;
                return;
            }

            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';

                card.innerHTML = `
              <div class="thumb">
                <img src="${game.img}" alt="${game.name}" loading="lazy" onerror="this.style.display='none'" />
                <span class="badge">${game.tagline || 'Game'}</span>
              </div>
              <div class="info">
                <h3>${game.name}</h3>
                <div class="tags">${game.tags.slice(0, 3).map(t => `<span>${t}</span>`).join('')}</div>
                <button class="launch-btn" data-key="${game.key}" data-name="${game.name}">▶ Launch</button>
              </div>
            `;

                card.querySelector('.launch-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    launchGame(game);
                });

                catalog.appendChild(card);
            });
        }

        // ============================================================
        // LAUNCH
        // ============================================================

        function launchGame(game) {
            const src = getLocalFallback(game);
            openOverlay(game.name);
            setTimeout(() => {
                loader.style.display = 'none';
                embedFrame.style.display = 'block';
                embedFrame.src = src;
            }, 500);
        }

        // ============================================================
        // OVERLAY
        // ============================================================

        function openOverlay(title) {
            embedOverlay.classList.add('active');
            loader.style.display = 'flex';
            embedFrame.style.display = 'none';
            embedFrame.src = 'about:blank';
            embedTitle.textContent = `▶ ${title}`;
            loaderLabel.textContent = `Starting ${title}...`;
            document.body.style.overflow = 'hidden';
        }

        function closeOverlay() {
            embedOverlay.classList.remove('active');
            if (embedFrame.src && embedFrame.src.startsWith('blob:')) {
                URL.revokeObjectURL(embedFrame.src);
            }
            embedFrame.src = 'about:blank';
            embedFrame.style.display = 'none';
            loader.style.display = 'flex';
            document.body.style.overflow = '';
        }

        closeEmbed.addEventListener('click', closeOverlay);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && embedOverlay.classList.contains('active')) {
                closeOverlay();
            }
        });

        // ============================================================
        // FULLSCREEN
        // ============================================================

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.();
            } else {
                document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            }
        });

        // ============================================================
        // SEARCH & FILTER
        // ============================================================

        searchInput.addEventListener('input', renderGames);
        tagFilter.addEventListener('change', renderGames);

        // ============================================================
        // INIT
        // ============================================================

        renderGames();
        console.log(`✦ NYX Launcher ready — ${GAMES.length} games loaded (blob fallback enabled)`);
    </script>
